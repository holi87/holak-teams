name: Validate Argus contracts

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-contracts:
    name: Full marketplace release gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Java template smoke drives Maven (mvn -B -ntp); setup-java does not install it.
      # Fail here, before the gate, when Maven is missing or does not run on Java 17, and when
      # python3 on PATH is not the 3.12 interpreter the Python template smoke builds its venv from.
      - name: Check Maven availability
        run: |
          command -v mvn >/dev/null 2>&1 || { echo '::error::Maven (mvn) is not installed on this runner'; exit 1; }
          mvn -B -ntp --version >"$RUNNER_TEMP/mvn-version.txt"
          cat "$RUNNER_TEMP/mvn-version.txt"
          grep -Eq '^Java version: 17\.' "$RUNNER_TEMP/mvn-version.txt" || { echo '::error::Maven does not run on Java 17'; exit 1; }
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 1)' || { echo '::error::python3 is not Python 3.12'; exit 1; }

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code @openai/codex

      - name: Install native sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --die-with-parent --new-session --unshare-all --share-net \
            --ro-bind / / --dev /dev --proc /proc \
            /bin/sh -c '/bin/true </dev/null'

      # Installs Chromium for the template's pinned Playwright plus its system libraries, so the
      # live hunt-driver smoke finds that exact browser revision already in the runner cache.
      - name: Install Playwright Chromium system dependencies
        run: |
          npx --yes playwright@$(node -p "require('./argus/framework-template/package-lock.json').packages['node_modules/playwright'].version") install --with-deps chromium

      - name: Run the documented full release validation
        run: scripts/validate-release.sh
